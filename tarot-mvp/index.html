<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>塔羅牌 MVP 三張牌測試頁</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17171b;
      --muted: #626674;
      --line: #ddd7cf;
      --paper: #fffaf4;
      --panel: #ffffff;
      --accent: #7c3f58;
      --accent-2: #1d6f7c;
      --gold: #b8872d;
      --soft: #f1ebe2;
      --dark: #18161d;
      --good: #236b4e;
      --warn: #925c00;
      --danger: #8a2d2d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--paper);
      color: var(--ink);
      overflow-x: hidden;
    }
    main {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(240px, 330px) 1fr;
      max-width: 100%;
      min-width: 0;
    }
    aside {
      border-right: 1px solid var(--line);
      background: #f7f1e8;
      padding: 24px 18px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      max-width: 100%;
      min-width: 0;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0;
    }
    h2 {
      margin: 0 0 12px;
      font-size: clamp(30px, 5vw, 54px);
      line-height: 1.05;
      letter-spacing: 0;
    }
    h3 {
      margin: 0 0 12px;
      font-size: 20px;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 12px;
      line-height: 1.7;
    }
    .sub {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 14px;
    }
    .side-note {
      border: 1px solid rgba(124, 63, 88, .22);
      border-radius: 8px;
      background: #fffaf4;
      padding: 12px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    .nav {
      display: grid;
      gap: 8px;
    }
    button,
    input,
    textarea {
      font: inherit;
    }
    button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      padding: 11px 12px;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    button.active {
      border-color: var(--accent);
      color: #fff;
      background: var(--accent);
    }
    button.primary {
      border-color: var(--gold);
      background: var(--gold);
      color: #17171b;
      font-weight: 700;
    }
    button.ghost {
      background: transparent;
    }
    textarea {
      width: 100%;
      min-height: 88px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fff;
      color: var(--ink);
      line-height: 1.55;
    }
    .stage {
      padding: 28px clamp(18px, 4vw, 52px);
      max-width: 1160px;
      width: 100%;
      min-width: 0;
    }
    .topline,
    .draw-actions,
    .choice-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .topline {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 18px;
    }
    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      background: var(--soft);
      max-width: 100%;
      overflow-wrap: anywhere;
    }
    .pill.good {
      border-color: rgba(35, 107, 78, .3);
      color: var(--good);
      background: #edf8f1;
    }
    .pill.warn {
      border-color: rgba(146, 92, 0, .28);
      color: var(--warn);
      background: #fff5dc;
    }
    .pill.owner {
      border-color: rgba(124, 63, 88, .28);
      color: var(--accent);
      background: #fff0f6;
    }
    .result-head {
      border-bottom: 1px solid var(--line);
      padding-bottom: 22px;
      margin-bottom: 22px;
    }
    .hero-copy {
      max-width: 820px;
    }
    .hero-copy p {
      color: var(--muted);
      font-size: 17px;
    }
    .value-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }
    .value-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 12px;
      min-width: 0;
    }
    .value-item strong {
      display: block;
      margin-bottom: 5px;
    }
    .question-grid,
    .grid,
    .report-grid {
      display: grid;
      gap: 14px;
      align-items: start;
      min-width: 0;
    }
    .question-grid {
      grid-template-columns: minmax(0, 1.3fr) minmax(220px, .7fr);
      margin-top: 18px;
    }
    .grid {
      grid-template-columns: minmax(0, 1fr) minmax(280px, .78fr);
    }
    .report-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .block,
    .input-panel,
    .status-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 16px;
      min-width: 0;
    }
    .label {
      display: block;
      margin-bottom: 8px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
    }
    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    .template-list {
      display: grid;
      gap: 8px;
    }
    .template-list button {
      padding: 9px 10px;
      color: var(--muted);
    }
    .draw-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--dark);
      color: #fff;
      padding: 18px;
      margin-bottom: 16px;
      min-width: 0;
    }
    .three-card-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
      min-width: 0;
    }
    .card-face {
      min-height: 210px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 8px;
      background: linear-gradient(160deg, #402038, #163b45);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 16px;
    }
    .card-face.empty {
      background: #23202a;
    }
    .card-face strong {
      display: block;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .card-face span {
      display: block;
      margin-top: 10px;
      color: rgba(255,255,255,.78);
    }
    .position {
      display: block;
      margin-bottom: 10px;
      color: rgba(255,255,255,.68);
      font-size: 13px;
    }
    .draw-actions button {
      background: #fff;
      color: #17171b;
    }
    .draw-actions button.active,
    .draw-actions button.primary {
      background: var(--gold);
      border-color: var(--gold);
      color: #17171b;
    }
    .free-list,
    .action-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .free-list li,
    .action-list li {
      border-left: 3px solid var(--accent-2);
      background: #f5fbfc;
      padding: 12px 14px;
      line-height: 1.65;
    }
    .action-list li {
      border-left-color: var(--gold);
      background: #fff8df;
    }
    .unlock {
      border-color: #d6bf82;
      background: #fff8df;
    }
    .payment-box {
      border: 1px solid #d6bf82;
      border-radius: 8px;
      background: #fffdf4;
      padding: 14px;
      margin-top: 12px;
    }
    .account-box {
      border: 1px solid rgba(124, 63, 88, .22);
      border-radius: 8px;
      background: #fff;
      padding: 14px;
      margin-top: 12px;
    }
    .account-status {
      border-radius: 8px;
      padding: 10px 12px;
      margin: 10px 0;
      color: var(--muted);
      background: var(--soft);
      line-height: 1.6;
    }
    .account-status.active {
      color: var(--good);
      background: #edf8f1;
    }
    .price-line {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
      margin: 8px 0 10px;
    }
    .price-line strong {
      font-size: 26px;
      color: var(--accent);
    }
    .report-title {
      border-left: 4px solid var(--gold);
      background: #fff8df;
      padding: 12px 14px;
      margin-bottom: 14px;
    }
    .risk-note {
      border: 1px solid rgba(138, 45, 45, .25);
      border-radius: 8px;
      background: #fff4f1;
      color: var(--danger);
      padding: 12px 14px;
      line-height: 1.65;
    }
    .field-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }
    .field-row input {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff;
      color: var(--ink);
    }
    .history-list {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }
    .history-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 12px;
    }
    .history-item button {
      margin-top: 8px;
      padding: 8px 10px;
    }
    .note {
      color: var(--muted);
      line-height: 1.65;
    }
    .divider {
      height: 1px;
      background: var(--line);
      margin: 14px 0;
    }
    footer {
      margin-top: 22px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    @media (max-width: 860px) {
      main { display: block; }
      aside {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .nav {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .nav button {
        width: 100%;
        min-height: 46px;
      }
      .stage { padding: 22px 16px; }
      .grid,
      .question-grid,
      .report-grid,
      .value-list {
        grid-template-columns: 1fr;
      }
      .field-row {
        grid-template-columns: 1fr;
      }
      .three-card-row {
        grid-template-columns: 1fr;
      }
      .card-face {
        min-height: 170px;
      }
    }
    @media (max-width: 640px) {
      aside { padding: 22px 16px; }
      .nav {
        grid-template-columns: 1fr;
      }
      .topline,
      .draw-actions,
      .choice-row {
        align-items: stretch;
      }
      .topline {
        display: grid;
        grid-template-columns: 1fr;
      }
      .topline .pill {
        border-radius: 8px;
      }
    }
  </style>
</head>
<body>
  <main>
    <aside>
      <h1>塔羅牌 MVP</h1>
      <p class="sub">輸入問題、選擇情境、抽三張牌。免費看方向，完整報告預覽下一步行動與風險提醒。</p>
      <nav class="nav" id="nav"></nav>
      <div class="side-note">目前是公開 Vercel MVP：可體驗流程與內容語氣，但尚未接會員、後端或真實付款。</div>
    </aside>
    <section class="stage">
      <div class="topline">
        <span class="pill good" id="deckStatus">牌庫載入中</span>
        <span class="pill">三張牌 MVP</span>
        <span class="pill">Free + Unlock Preview</span>
        <span class="pill warn">未接真金流</span>
      </div>
      <article id="content"></article>
      <footer>提醒：塔羅內容定位為娛樂與自我探索參考；金錢、身心與法律相關問題不得取代專業投資、醫療或法律建議。</footer>
    </section>
  </main>
  <script>
    let deck = [];
    let selected = null;
    let drawn = [];
    let paidOpen = false;
    let userQuestion = "";
    let lastReportId = "";
    let reportHistory = [];
    let unlockedReports = {};
    let waitlistContact = "";
    let accountEmail = "";
    let restoredCategoryId = "";

    const historyKey = "tarotMvpReports";
    const unlockKey = "tarotMvpUnlocks";
    const waitlistKey = "tarotMvpWaitlistContact";
    const accountKey = "tarotMvpAccountEmail";
    const currentReadingKey = "tarotMvpCurrentReading";
    const unlimitedAccounts = [
      {
        emailHash: "c3e84b2e13684b2d",
        name: "William 小主人",
        plan: "無限使用"
      }
    ];

    const categories = [
      {
        id: "love_relationship",
        name: "愛情感情",
        questions: ["他/她現在對我是什麼感覺？", "這段關係接下來會怎麼發展？"],
        tone: "溫柔、陪伴、給情緒安定感，但不做絕對承諾。",
        unlock: "解鎖完整感情牌面，查看對方或關係互動、主要阻礙，以及下一步最適合怎麼做。",
        safety: "不保證復合、結婚、對方一定愛或不愛；重點放在互動線索、界線與下一步行動。",
        actions: ["寫下你最需要的三個關係條件。", "用不施壓的方式確認一次需求。", "設定觀察期限，看對方是否用行動回應。"]
      },
      {
        id: "career_workplace",
        name: "工作職場",
        questions: ["我現在適合換工作嗎？", "主管或同事怎麼看我？"],
        tone: "務實、清楚、偏行動建議，幫使用者看見職場局勢。",
        unlock: "解鎖完整職場解析，了解目前工作局勢、潛在風險，以及最有利的下一步選擇。",
        safety: "不代替使用者做重大職涯決策；提供觀察點、準備事項與低風險下一步。",
        actions: ["整理目前任務、成果與卡點。", "釐清權責與溝通紀錄。", "先做一個可逆的小步測試。"]
      },
      {
        id: "business_fortune",
        name: "事業運勢",
        questions: ["我目前的事業方向對嗎？", "接下來適合擴張、轉型或創業嗎？"],
        tone: "策略感、長線視角，重點放在趨勢與階段判斷。",
        unlock: "解鎖完整事業運勢，看清發展階段、機會窗口，以及未來一段時間的關鍵突破點。",
        safety: "適合創業、品牌、接案、副業與方向選擇；不承諾必然成功或收入成長。",
        actions: ["把方向拆成一個可驗證假設。", "先檢查資源、人脈與執行節奏。", "用小規模測試確認市場反應。"]
      },
      {
        id: "money_wealth",
        name: "金錢財運",
        questions: ["我近期財運如何？", "這筆投資、支出或合作適合嗎？"],
        tone: "保守、風險提醒優先，不保證獲利。",
        unlock: "解鎖完整財運牌面，查看近期金錢流向、容易失血的位置，以及該守財還是進攻。",
        safety: "必須加上非投資建議提醒；不得保證收益、不得給明確買賣指令。",
        actions: ["先盤點固定支出與現金流。", "查清楚投資或合作條件與退出機制。", "避免因壓力、人情或想像收益衝動投入。"]
      },
      {
        id: "social_relationship",
        name: "人際關係",
        questions: ["這個朋友、家人或合作對象怎麼看我？", "這段關係該繼續靠近還是保持距離？"],
        tone: "中立、洞察互動盲點，避免煽動對立。",
        unlock: "解鎖完整人際解析，了解對方態度、誤會來源，以及最適合的相處界線。",
        safety: "重點放在界線、溝通與互動模式；避免鼓勵衝突或操控對方。",
        actions: ["先確認自己的界線與底線。", "把猜測改成一次清楚溝通。", "保留善意，但不要用壓低自己維持和平。"]
      },
      {
        id: "wellbeing_reminder",
        name: "身心狀態與提醒",
        questions: ["我最近狀態為什麼這麼卡？", "現在最需要注意什麼？"],
        tone: "療癒、穩定、低壓提醒，不做醫療診斷。",
        unlock: "解鎖完整身心提醒，看看目前能量狀態、壓力來源，以及牌面給你的調整建議。",
        safety: "不得提供醫療診斷或治療建議；若有危機或症狀，請尋求專業協助。",
        actions: ["先把睡眠、飲食、作息拉回基本盤。", "分辨哪些壓力真的需要處理。", "降低外界雜訊，給自己恢復空間。"]
      }
    ];

    const spreadPositions = {
      love_relationship: ["你的真實感受", "對方/關係能量", "最適合的行動"],
      career_workplace: ["目前職場局勢", "阻力或資源", "低風險下一步"],
      money_wealth: ["近期金錢流向", "失血或誤判位置", "守財或行動建議"],
      business_fortune: ["發展階段", "機會窗口", "關鍵突破點"],
      social_relationship: ["你的界線", "對方/互動模式", "相處距離建議"],
      wellbeing_reminder: ["目前能量", "壓力來源", "調整建議"]
    };

    const nav = document.querySelector("#nav");
    const content = document.querySelector("#content");
    const deckStatus = document.querySelector("#deckStatus");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function currentQuestion(item) {
      return userQuestion.trim() || item.questions[0];
    }

    function normalizeEmail(value) {
      return String(value || "").trim().toLowerCase();
    }

    function hashEmail(value) {
      let h1 = 0xdeadbeef;
      let h2 = 0x41c6ce57;
      const text = normalizeEmail(value);
      for (let i = 0; i < text.length; i += 1) {
        const ch = text.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return `${(h2 >>> 0).toString(16).padStart(8, "0")}${(h1 >>> 0).toString(16).padStart(8, "0")}`;
    }

    function activeUnlimitedAccount() {
      const emailHash = hashEmail(accountEmail);
      return unlimitedAccounts.find(account => account.emailHash === emailHash) || null;
    }

    function hasUnlimitedAccess() {
      return Boolean(activeUnlimitedAccount());
    }

    function reportUnlocked() {
      return hasUnlimitedAccess() || Boolean(lastReportId && unlockedReports[lastReportId]);
    }

    function loadState() {
      try {
        reportHistory = JSON.parse(localStorage.getItem(historyKey) || "[]");
        unlockedReports = JSON.parse(localStorage.getItem(unlockKey) || "{}");
        waitlistContact = localStorage.getItem(waitlistKey) || "";
        accountEmail = localStorage.getItem(accountKey) || "";
      } catch {
        reportHistory = [];
        unlockedReports = {};
        waitlistContact = "";
        accountEmail = "";
      }
    }

    function persistState() {
      localStorage.setItem(historyKey, JSON.stringify(reportHistory.slice(0, 12)));
      localStorage.setItem(unlockKey, JSON.stringify(unlockedReports));
      localStorage.setItem(waitlistKey, waitlistContact);
      localStorage.setItem(accountKey, accountEmail);
    }

    function persistCurrentReading() {
      const payload = {
        categoryId: selected?.id || restoredCategoryId || categories[0]?.id || "",
        question: userQuestion,
        reportId: lastReportId,
        paidOpen,
        cards: drawn.map(card => ({
          id: card.id,
          orientation: card.orientation
        }))
      };
      localStorage.setItem(currentReadingKey, JSON.stringify(payload));
    }

    function clearCurrentReading() {
      localStorage.removeItem(currentReadingKey);
    }

    function loadCurrentReading() {
      try {
        const saved = JSON.parse(localStorage.getItem(currentReadingKey) || "null");
        if (!saved || typeof saved !== "object") return;
        restoredCategoryId = saved.categoryId || "";
        userQuestion = saved.question || "";
        lastReportId = saved.reportId || "";
        paidOpen = Boolean(saved.paidOpen);
        const cards = Array.isArray(saved.cards) ? saved.cards : [];
        drawn = cards
          .map(savedCard => {
            const card = deck.find(item => item.id === savedCard.id);
            if (!card) return null;
            return {
              ...card,
              orientation: savedCard.orientation === "逆位" ? "逆位" : "正位"
            };
          })
          .filter(Boolean);
      } catch {
        restoredCategoryId = "";
        userQuestion = "";
        lastReportId = "";
        paidOpen = false;
        drawn = [];
      }
    }

    function drawThreeCards() {
      const pool = [...deck];
      const cards = [];
      for (let i = 0; i < 3 && pool.length; i += 1) {
        const index = Math.floor(Math.random() * pool.length);
        const card = pool.splice(index, 1)[0];
        cards.push({
          ...card,
          orientation: Math.random() > 0.5 ? "正位" : "逆位"
        });
      }
      lastReportId = `TAROT-${new Date().toISOString().slice(0, 10).replaceAll("-", "")}-${Math.floor(1000 + Math.random() * 9000)}`;
      if (hasUnlimitedAccess()) {
        unlockedReports[lastReportId] = true;
        persistState();
      }
      persistCurrentReading();
      return cards;
    }

    function cardSentence(card) {
      if (!card) return "尚未抽牌。";
      return card.orientation === "正位" ? card.upright_free : card.reversed_free;
    }

    function currentReport(item) {
      if (!drawn.length) return null;
      const positions = spreadPositions[item.id] || ["第一張", "第二張", "第三張"];
      return {
        id: lastReportId,
        createdAt: new Date().toISOString(),
        categoryId: item.id,
        categoryName: item.name,
        question: currentQuestion(item),
        unlocked: reportUnlocked(),
        summary: makeSummary(item).replace(/<[^>]*>/g, ""),
        cards: drawn.map((card, index) => ({
          position: positions[index],
          id: card.id,
          name_zh: card.name_zh,
          name_en: card.name_en,
          orientation: card.orientation,
          free: cardSentence(card),
          paid_expansion_points: card.paid_expansion_points,
          risk_note: card.risk_note
        })),
        actions: item.actions,
        safety: item.safety
      };
    }

    function saveCurrentReport(item) {
      const report = currentReport(item);
      if (!report) return;
      reportHistory = [report, ...reportHistory.filter(existing => existing.id !== report.id)].slice(0, 12);
      persistState();
    }

    function reportToText(report) {
      if (!report) return "";
      const cardText = report.cards.map(card => [
        `${card.position}｜${card.name_zh} ${card.orientation}`,
        card.free,
        ...card.paid_expansion_points.map(point => `- ${point}`),
        card.risk_note ? `風險提醒：${card.risk_note}` : ""
      ].filter(Boolean).join("\n")).join("\n\n");
      return [
        `塔羅牌 MVP 報告 ${report.id}`,
        `時間：${report.createdAt}`,
        `類別：${report.categoryName}`,
        `問題：${report.question}`,
        "",
        "摘要",
        report.summary,
        "",
        "三張牌",
        cardText,
        "",
        "下一步行動",
        ...report.actions.map(action => `- ${action}`),
        "",
        `安全限制：${report.safety}`
      ].join("\n");
    }

    function downloadCurrentReport(item) {
      const report = currentReport(item);
      if (!report) return;
      const blob = new Blob([reportToText(report)], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `${report.id}.txt`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function renderHistory() {
      if (!reportHistory.length) {
        return `<p class="note">尚無本機報告紀錄。抽牌後按「保存報告」即可在這裡回看最近 12 筆。</p>`;
      }
      return `
        <div class="history-list">
          ${reportHistory.map(report => `
            <div class="history-item">
              <strong>${escapeHtml(report.categoryName)}｜${escapeHtml(report.id)}</strong>
              <p class="note">${escapeHtml(report.question)}</p>
              <p>${escapeHtml(report.cards.map(card => `${card.name_zh}${card.orientation}`).join("、"))}</p>
              <span class="pill ${report.unlocked ? "good" : "warn"}">${report.unlocked ? "已模擬解鎖" : "未解鎖"}</span>
            </div>
          `).join("")}
        </div>`;
    }

    function makeSummary(item) {
      if (!drawn.length) {
        return `請先輸入問題並抽三張牌。MVP 會使用 ${deck.length || 78} 張 structured content 產生免費摘要與付費報告預覽。`;
      }
      const first = drawn[0];
      const second = drawn[1];
      const third = drawn[2];
      return `針對「${escapeHtml(currentQuestion(item))}」，這組牌先把重點放在「${escapeHtml(cardSentence(first))}」；中段提醒你留意「${escapeHtml(cardSentence(second))}」。最後的方向是「${escapeHtml(cardSentence(third))}」。整體來看，現在最適合先看清局勢，再做低風險下一步。`;
    }

    function renderCards(item) {
      const positions = spreadPositions[item.id] || ["第一張", "第二張", "第三張"];
      const cards = drawn.length ? drawn : [null, null, null];
      return `
        <div class="three-card-row">
          ${cards.map((card, index) => `
            <div class="card-face ${card ? "" : "empty"}">
              <div>
                <span class="position">${positions[index]}</span>
                <strong>${card ? escapeHtml(card.name_zh) : "尚未抽牌"}</strong>
                <span>${card ? `${escapeHtml(card.name_en)}｜${card.orientation}` : "輸入問題後抽牌"}</span>
              </div>
            </div>
          `).join("")}
        </div>`;
    }

    function renderFreeResult(item) {
      if (!drawn.length) {
        return `<p class="note">目前尚未抽牌。輸入問題後，系統會從 78 張牌中抽出三張不重複牌，並依正逆位產生免費短解。</p>`;
      }
      const positions = spreadPositions[item.id] || ["第一張", "第二張", "第三張"];
      return `
        <p>${makeSummary(item)}</p>
        <ul class="free-list">
          ${drawn.map((card, index) => `
            <li><strong>${positions[index]}｜${escapeHtml(card.name_zh)} ${card.orientation}</strong><br>${escapeHtml(cardSentence(card))}</li>
          `).join("")}
        </ul>`;
    }

    function renderPaidResult(item) {
      if (!drawn.length) {
        return `<p class="note">抽牌後可在此預覽完整報告格式。MVP 目前只展示解鎖狀態，不處理真實付款。</p>`;
      }
      const positions = spreadPositions[item.id] || ["第一張", "第二張", "第三張"];
      return `
        <div class="report-title">
          <strong>${escapeHtml(item.name)}完整三張牌報告</strong>
          <p class="note">這份預覽示範解鎖後的閱讀深度：不只列牌義，也把三張牌串成可執行的下一步。</p>
        </div>
        <p><strong>報告編號：${lastReportId}</strong></p>
        <p>${makeSummary(item)}</p>
        ${drawn.map((card, index) => `
          <div class="divider"></div>
          <p><strong>${positions[index]}｜${escapeHtml(card.name_zh)} ${card.orientation}</strong><br>${escapeHtml(cardSentence(card))}</p>
          <ul class="action-list">
            ${card.paid_expansion_points.map(point => `<li>${escapeHtml(point)}</li>`).join("")}
          </ul>
        `).join("")}
        <div class="divider"></div>
        <h3>下一步行動</h3>
        <ul class="action-list">
          ${item.actions.map(action => `<li>${escapeHtml(action)}</li>`).join("")}
        </ul>
        <div class="divider"></div>
        <h3>風險與界線</h3>
        <p class="risk-note">${escapeHtml(item.safety)} 塔羅不保證結果，也不替你做不可逆的現實決定；若涉及安全、醫療、法律或投資，請優先找合格專業人士。</p>`;
    }

    function renderAccountStatus() {
      const account = activeUnlimitedAccount();
      if (account) {
        return `
          <div class="account-status active">
            <strong>${escapeHtml(account.name)}</strong> 已啟用 ${escapeHtml(account.plan)}。
            這個裝置已通過白名單 Gmail 驗證，所有抽牌報告都會自動標記為已解鎖。
          </div>`;
      }
      return `
        <div class="account-status">
          尚未啟用無限使用帳號。請輸入 Jason 指定的白名單 Gmail。
        </div>`;
    }

    function renderTemplates(item) {
      return item.questions.map(question => `
        <button type="button" class="templateBtn" data-question="${escapeHtml(question)}">${escapeHtml(question)}</button>
      `).join("");
    }

    function render(item) {
      selected = item;
      const account = activeUnlimitedAccount();
      document.querySelectorAll(".nav button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.id === item.id);
      });
      content.innerHTML = `
        <div class="result-head">
          <div class="hero-copy">
            <h2>${escapeHtml(item.name)}</h2>
            <p>把你的問題放進三張牌牌陣：第一張看現況，第二張看阻力或關係能量，第三張給低風險下一步。</p>
          </div>
          <div class="value-list">
            <div class="value-item"><strong>免費摘要</strong><span class="note">立即看三張牌短解與整體方向。</span></div>
            <div class="value-item"><strong>完整報告預覽</strong><span class="note">示範逐張展開、串連重點與行動建議。</span></div>
            <div class="value-item"><strong>安全界線</strong><span class="note">不做復合、獲利、醫療或法律保證。</span></div>
          </div>
          <p class="note" style="margin-top:14px">${escapeHtml(item.tone)}</p>
          <div class="question-grid">
            <section class="input-panel">
              <span class="label">你的問題</span>
              <textarea id="questionInput" placeholder="請輸入想問的問題">${escapeHtml(userQuestion)}</textarea>
              <p class="hint">問題會帶入免費摘要與付費報告預覽。MVP 不會保存個資，也不接真實付款。</p>
            </section>
            <section class="input-panel">
              <span class="label">快速問題模板</span>
              <div class="template-list">${renderTemplates(item)}</div>
            </section>
          </div>
        </div>
        <section class="draw-panel">
          ${renderCards(item)}
          <p>${drawn.length ? `已從 ${deck.length} 張牌抽出三張不重複牌。` : `牌庫已準備 ${deck.length || 0} 張，請輸入問題後抽牌。`}</p>
          <div class="draw-actions">
            <button type="button" id="drawBtn" class="primary">抽三張牌</button>
            <button type="button" id="freeBtn" class="${paidOpen ? "" : "active"}">免費摘要</button>
            <button type="button" id="paidBtn" class="${paidOpen ? "active" : ""}">付費報告預覽</button>
            <button type="button" id="saveBtn">保存報告</button>
            <button type="button" id="downloadBtn">下載報告</button>
            <button type="button" id="resetBtn" class="ghost">重置</button>
          </div>
        </section>
        <div class="grid">
          <section class="block">
            <span class="label">${paidOpen ? "付費完整報告預覽" : "免費版結果"}</span>
            ${paidOpen ? renderPaidResult(item) : renderFreeResult(item)}
          </section>
          <section class="block unlock">
            <span class="label">解鎖設計</span>
            <p>${escapeHtml(item.unlock)}</p>
            <div class="payment-box">
              <span class="label">付款狀態</span>
              <p><strong>${drawn.length && reportUnlocked() ? (account ? `${account.name} 無限使用中` : "已模擬解鎖") : "候補收集 / 金流未接"}</strong></p>
              <div class="price-line"><strong>NT$ 49</strong><span class="note">MVP 測試價，占位文案，尚未啟用真實付款。</span></div>
              <p class="note">下一階段才接綠界、藍新、TapPay、PayPal 或 Gumroad。未經 Jason 同意前，不綁定真實付款帳戶，也不收信用卡資料。</p>
              <div class="account-box">
                <span class="label">白名單帳號</span>
                ${renderAccountStatus()}
                <div class="field-row">
                  <input id="accountInput" type="email" inputmode="email" autocomplete="email" placeholder="輸入 Gmail 啟用無限使用" value="${escapeHtml(accountEmail)}">
                  <button type="button" id="accountBtn">啟用帳號</button>
                </div>
              </div>
              <div class="field-row">
                <input id="waitlistInput" type="text" placeholder="候補聯絡方式或備註" value="${escapeHtml(waitlistContact)}">
                <button type="button" id="waitlistBtn">保存候補</button>
              </div>
              <div class="draw-actions" style="margin-top:10px">
                <button type="button" id="mockUnlockBtn" ${drawn.length && !account ? "" : "disabled"}>${account ? "無限帳號已啟用" : drawn.length && unlockedReports[lastReportId] ? "重新標記解鎖" : "模擬解鎖"}</button>
              </div>
            </div>
            <div class="divider"></div>
            <span class="label">安全限制</span>
            <p class="note">${escapeHtml(item.safety)}</p>
          </section>
        </div>
        <section class="block" style="margin-top:14px">
          <span class="label">MVP 驗收點</span>
          <div class="report-grid">
            <p><strong>內容</strong><br><span class="note">78 張 structured JSON、正逆位短解、每張 3 個付費展開點。</span></p>
            <p><strong>流程</strong><br><span class="note">問題輸入、情境切換、三張牌抽牌、免費/付費切換。</span></p>
            <p><strong>缺口</strong><br><span class="note">尚未接後端、會員、訂單保存與真實金流。</span></p>
          </div>
          <div class="divider"></div>
          <span class="label">本機報告紀錄</span>
          ${renderHistory()}
        </section>`;

      document.querySelector("#questionInput").addEventListener("input", event => {
        userQuestion = event.target.value;
        persistCurrentReading();
      });
      document.querySelectorAll(".templateBtn").forEach(button => {
        button.addEventListener("click", () => {
          userQuestion = button.dataset.question;
          render(selected);
        });
      });
      document.querySelector("#drawBtn").addEventListener("click", () => {
        userQuestion = document.querySelector("#questionInput").value;
        drawn = drawThreeCards();
        paidOpen = false;
        persistCurrentReading();
        render(selected);
      });
      document.querySelector("#freeBtn").addEventListener("click", () => {
        paidOpen = false;
        persistCurrentReading();
        render(selected);
      });
      document.querySelector("#paidBtn").addEventListener("click", () => {
        paidOpen = true;
        persistCurrentReading();
        render(selected);
      });
      document.querySelector("#saveBtn").addEventListener("click", () => {
        saveCurrentReport(selected);
        persistCurrentReading();
        render(selected);
      });
      document.querySelector("#downloadBtn").addEventListener("click", () => {
        downloadCurrentReport(selected);
      });
      document.querySelector("#accountBtn").addEventListener("click", () => {
        accountEmail = document.querySelector("#accountInput").value.trim();
        if (hasUnlimitedAccess() && lastReportId) {
          unlockedReports[lastReportId] = true;
        }
        persistState();
        persistCurrentReading();
        render(selected);
      });
      document.querySelector("#waitlistBtn").addEventListener("click", () => {
        waitlistContact = document.querySelector("#waitlistInput").value.trim();
        persistState();
        render(selected);
      });
      document.querySelector("#mockUnlockBtn").addEventListener("click", () => {
        if (!lastReportId) return;
        unlockedReports[lastReportId] = true;
        saveCurrentReport(selected);
        paidOpen = true;
        persistState();
        persistCurrentReading();
        render(selected);
      });
      document.querySelector("#resetBtn").addEventListener("click", () => {
        drawn = [];
        paidOpen = false;
        lastReportId = "";
        clearCurrentReading();
        render(selected);
      });
      persistCurrentReading();
    }

    function initNav() {
      nav.innerHTML = "";
      categories.forEach(item => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.dataset.id = item.id;
        btn.textContent = item.name;
        btn.addEventListener("click", () => {
          paidOpen = false;
          render(item);
        });
        nav.appendChild(btn);
      });
      const initial = categories.find(item => item.id === restoredCategoryId) || categories[0];
      render(initial);
    }

    fetch("tarot-card-content-structured-20260608.json")
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(payload => {
        deck = Array.isArray(payload.cards) ? payload.cards : [];
        deckStatus.textContent = `牌庫 ${deck.length} 張`;
        deckStatus.classList.add("good");
        loadState();
        loadCurrentReading();
        initNav();
      })
      .catch(error => {
        deck = [];
        deckStatus.textContent = "牌庫載入失敗";
        deckStatus.classList.remove("good");
        deckStatus.classList.add("warn");
        loadState();
        initNav();
        content.insertAdjacentHTML("afterbegin", `<p class="note">牌庫 JSON 載入失敗：${escapeHtml(error.message)}。請用本地 server 或 GitHub Pages 開啟此頁。</p>`);
      });
  </script>
</body>
</html>
