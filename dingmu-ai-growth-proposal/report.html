<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>鼎沐專業系統櫥櫃｜完整研究報告</title>
  <style>
    :root{--ink:#17211d;--forest:#1f3a32;--wood:#a26a3c;--paper:#f6f3ee;--line:rgba(23,33,29,.16)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;line-height:1.75}.wrap{max-width:980px;margin:auto;padding:32px 22px 80px}.back{display:inline-flex;text-decoration:none;background:var(--forest);color:#fff;border-radius:999px;padding:10px 15px;font-weight:900}.hero{padding:56px 0 32px;border-bottom:4px solid var(--forest)}.hero span{color:var(--wood);font-weight:900}.hero h1{font-family:"Noto Serif TC",serif;font-size:clamp(38px,7vw,76px);line-height:1.04;letter-spacing:-.05em;margin:12px 0}.hero p{font-size:19px;color:#58635d}article{padding-top:24px}h1,h2,h3{font-family:"Noto Serif TC",serif;line-height:1.2}article h1{display:none}h2{font-size:32px;margin-top:52px;border-top:1px solid var(--line);padding-top:26px}h3{font-size:23px;color:var(--forest);margin-top:34px}p,li{font-size:17px}blockquote{margin:24px 0;padding:18px 22px;border-left:5px solid var(--wood);background:#fff;font-size:20px}code{background:#e8e0d6;padding:2px 5px;border-radius:4px}a{color:#215a48}table{border-collapse:collapse;width:100%;display:block;overflow:auto;background:#fff}th,td{padding:12px 14px;text-align:left;vertical-align:top;border:1px solid var(--line);min-width:150px}th{background:var(--forest);color:#fff}ul,ol{padding-left:24px}.loading{padding:50px 0;color:#66716a}@media(max-width:600px){.wrap{padding:20px 15px 60px}h2{font-size:27px}p,li{font-size:16px}}
  </style>
</head>
<body><main class="wrap"><a class="back" href="index.html">← 返回簡報</a><section class="hero"><span>FULL RESEARCH REPORT · 2026.11.12</span><h1>鼎沐專業系統櫥櫃</h1><p>公司公開資料、客群與數位足跡、AI 導入建議、90 天路線圖與拜訪問題。</p></section><article id="report"><p class="loading">正在載入完整研究報告…</p></article></main>
<script>
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/&lt;(https?:\/\/[^&]+)&gt;/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
fetch('report.md').then(r=>r.text()).then(md=>{
  const lines=md.split(/\r?\n/), out=[]; let list=null, table=[];
  const flushList=()=>{if(list){out.push(`</${list}>`);list=null}};
  const flushTable=()=>{if(!table.length)return;const rows=table.filter(r=>!/^\s*\|?\s*[-:]+/.test(r));out.push('<table>'+rows.map((r,i)=>{const cells=r.replace(/^\||\|$/g,'').split('|').map(x=>x.trim());const tag=i===0?'th':'td';return '<tr>'+cells.map(c=>`<${tag}>${inline(c)}</${tag}>`).join('')+'</tr>'}).join('')+'</table>');table=[]};
  for(let i=0;i<lines.length;i++){const line=lines[i];if(/^\|/.test(line)){flushList();table.push(line);continue}else flushTable();if(!line.trim()){flushList();continue}const h=line.match(/^(#{1,3})\s+(.+)/);if(h){flushList();out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`);continue}const ul=line.match(/^[-*]\s+(.+)/),ol=line.match(/^\d+\.\s+(.+)/);if(ul||ol){const kind=ol?'ol':'ul';if(list!==kind){flushList();out.push(`<${kind}>`);list=kind}out.push(`<li>${inline((ul||ol)[1])}</li>`);continue}if(line.startsWith('> ')){flushList();out.push(`<blockquote>${inline(line.slice(2))}</blockquote>`);continue}flushList();out.push(`<p>${inline(line)}</p>`)}flushList();flushTable();document.getElementById('report').innerHTML=out.join('\n');
}).catch(()=>document.getElementById('report').innerHTML='<p>報告載入失敗，請返回簡報後再試。</p>');
</script></body></html>
